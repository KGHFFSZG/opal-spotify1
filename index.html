<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lunaware Spotify Authorization</title>
  <style>
    :root {
      --spotify-green: #1DB954;
      --glass-bg: rgba(20, 20, 20, 0.85);
      --glass-border: rgba(255, 255, 255, 0.1);
      --accent-glow: rgba(29, 185, 84, 0.3);
    }

    body {
      margin: 0;
      padding: 0;
      background-color: #0c0c0c;
      background-image: radial-gradient(circle at top right, #1a1a1a, #0c0c0c);
      color: #fff;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }

    .container {
      background: var(--glass-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border);
      border-radius: 24px;
      padding: 40px;
      text-align: center;
      width: 400px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 0 40px var(--accent-glow);
      animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .icon {
      width: 64px;
      height: 64px;
      background-color: var(--spotify-green);
      border-radius: 50%;
      margin: 0 auto 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 20px var(--spotify-green);
      animation: pulse 2s infinite ease-in-out;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 0 0 12px;
      background: linear-gradient(to bottom right, #fff, #888);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #aaa;
      font-size: 0.95rem;
      line-height: 1.6;
      margin: 0;
    }

    .loader {
      margin-top: 24px;
      display: flex;
      justify-content: center;
      gap: 8px;
    }

    .dot {
      width: 4px;
      height: 4px;
      background: var(--spotify-green);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
    }

    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    #status-msg { margin-top: 10px; font-weight: 600; color: var(--spotify-green); }
    #status-msg.error { color: #ff4444; }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(20px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(29, 185, 84, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(29, 185, 84, 0); }
      100% { box-shadow: 0 0 0 0 rgba(29, 185, 84, 0); }
    }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="white">
        <path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.49 17.306c-.215.353-.674.464-1.026.25-2.852-1.742-6.443-2.136-10.672-1.17-.404.093-.807-.156-.9-.56a.71.71 0 0 1 .561-.899c4.636-1.06 8.604-.61 11.787 1.336.353.215.464.674.25 1.026zm1.465-3.262c-.27.439-.848.58-1.287.31-3.264-2.006-8.243-2.583-12.106-1.41-.497.15-1.02-.132-1.171-.63a.87.87 0 0 1 .63-.1171c4.417-1.34 9.907-.69 13.626 1.59.439.27.58.848.31 1.287zm.135-3.41c-3.916-2.324-10.37-2.541-14.126-1.4a1.05 1.05 0 0 1-1.272-.75.105.105 0 0 1 .75-1.27c4.276-1.299 11.41-1.033 15.903 1.636a1.052 1.052 0 0 1-1.035 1.83z"/>
      </svg>
    </div>
    <h1>Lunaware Spotify</h1>
    <p id="msg">Exchanging verification code…</p>
    <div id="loader" class="loader">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <div id="status-msg">Redirecting…</div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const code  = params.get('code');
    const error = params.get('error');

    if (code) {
      // Redirect to the local Spotify server
      setTimeout(() => {
        window.location.href = 'http://localhost:4030' + encodeURIComponent(code);
      }, 800);
    } else if (error) {
      document.addEventListener('DOMContentLoaded', () => {
        document.getElementById('msg').textContent = 'Spotify authorization failed.';
        document.getElementById('status-msg').textContent = error;
        document.getElementById('status-msg').className = 'error';
        document.getElementById('loader').style.display = 'none';
      });
    } else {
      document.getElementById('msg').textContent = 'No authorization code found.';
      document.getElementById('loader').style.display = 'none';
    }
  </script>
</body>
</html>
